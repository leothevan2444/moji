name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    # Keep browser binaries, fonts and system libraries identical to the baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust workspace for container run steps
        working-directory: ${{ github.workspace }}
        # checkout configures Git in its action environment; run steps can use
        # another HOME inside the container and need their own exact-path entry.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npm run test:visual
      - name: Upload visual test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: web/test-results/
          retention-days: 7

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: python3 scripts/version_test.py
      - run: go test ./internal/graphqlapi ./internal/taskruntime ./cmd/moji

  docker:
    name: Docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make docker-build
      - run: make docker-test

  publish:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [web, go, docker]
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
