name: Docker Publish

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from Git
        id: version
        run: |
          version=$(sh scripts/version.sh)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Release version does not match the triggering Git tag: $GITHUB_REF_NAME ($version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download tested images from this CI run
        uses: actions/download-artifact@v4
        with:
          pattern: moji-image-*
          path: ${{ runner.temp }}/moji-images

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/moji
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Publish tested images and merge platform manifests
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/moji
          VERSION: ${{ steps.version.outputs.version }}
          DOCKER_METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: >-
          python3 scripts/docker_publish.py
          --artifacts "$RUNNER_TEMP/moji-images"
          --image "$IMAGE"
          --version "$VERSION"
          --revision "$GITHUB_SHA"
          --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
