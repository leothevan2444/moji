extend type Query {
  "Bounded task lists and mutually exclusive operational counts for Home."
  homeOverview: HomeOverview!
  "Persisted subscription health without an upstream performer catalogue read."
  homeSubscriptionSummary: HomeSubscriptionSummary!
}

type HomeOverview {
  total: Int!
  attention: Int!
  active: Int!
  waiting: Int!
  completedLast24Hours: Int!
  attentionTasks: [Task!]!
  activeTasks: [Task!]!
  recentTasks: [Task!]!
}

type HomeSubscriptionSummary {
  total: Int!
  attention: Int!
  unchecked: Int!
  lastCheckedAt: String
  attentionPerformerIds: [ID!]!
}

extend type Query {
  "Bounded local check progress, schedule, and latest outcomes for Home."
  homeSubscriptionChecks: HomeSubscriptionChecks!
}

type HomeSubscriptionChecks {
  enabled: Boolean!
  nextRunAt: String
  activeCount: Int!
  latestScheduled: HomeSubscriptionCheckRun
  activeRuns: [HomeSubscriptionCheckRun!]!
  recentRuns: [HomeSubscriptionCheckRun!]!
}

type HomeSubscriptionCheckRun {
  id: ID!
  trigger: SubscriptionCheckTrigger!
  scope: SubscriptionCheckScope!
  status: SubscriptionCheckStatus!
  startedAt: String!
  finishedAt: String
  totalCount: Int!
  completedCount: Int!
  succeededCount: Int!
  failedCount: Int!
  skippedCount: Int!
  currentPerformers: [HomeCheckPerformer!]!
}

type HomeCheckPerformer {
  performerId: ID!
  name: String!
}
