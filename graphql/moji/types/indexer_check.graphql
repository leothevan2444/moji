extend type Mutation { testIndexer(input: TestIndexerInput!): IndexerCheckReport! }
input TestIndexerInput {
 clientId: ID
 requestId: ID
 instanceId: ID
 expectedRevision: String!
 definitionId: String
 draft: BuiltinIndexerPatchInput
 connectionOnly: Boolean! = false
 search: Boolean! = false
 keywords: String
 download: Boolean! = false
}
enum IndexerCheckStageName { CONFIGURATION AUTHENTICATION SEARCH DOWNLOAD CONNECTION }
enum IndexerCheckStageState { SKIPPED NOT_REQUESTED NOT_REQUIRED NOT_OBSERVED PASSED FAILED EMPTY PARTIAL NO_CANDIDATE }
type IndexerCheckStage { name: IndexerCheckStageName! state: IndexerCheckStageState! errorCode: String! elapsedMs: Long! }
type IndexerCheckReport {
 id: ID!
 instanceId: ID!
 kind: IndexerSourceKind
 configRevision: String!
 ruleRevision: String!
 startedAt: String!
 finishedAt: String!
 results: Int!
 partial: Boolean!
 truncated: Boolean!
 stages: [IndexerCheckStage!]!
}


extend type Subscription { indexerCheckActivity(clientId: ID!): [IndexerCheckActivity!]! }
enum IndexerCheckActivityState { QUEUED RUNNING }
type IndexerCheckActivity { requestId: ID! instanceId: ID! state: IndexerCheckActivityState! }
