extend type Query {
  indexerDefinitions(input: IndexerDefinitionFilterInput): IndexerDefinitionPage!
  indexerInstances: IndexerInstances!
}
extend type Mutation {
  addBuiltinIndexer(expectedRevision: String!, input: BuiltinIndexerInput!): BuiltinIndexerResult!
  updateBuiltinIndexer(id: ID!, expectedRevision: String!, input: BuiltinIndexerPatchInput!): BuiltinIndexerResult!
  removeBuiltinIndexer(id: ID!, expectedRevision: String!): IndexerInstances!
  setIndexerEnabled(id: ID!, expectedRevision: String!, enabled: Boolean!): IndexerInstances!
  reorderIndexers(expectedRevision: String!, ids: [ID!]!): IndexerInstances!
  refreshJackettIndexers: IndexerInstances!
}
enum IndexerSourceKind { BUILTIN JACKETT }
type IndexerSettingValue { string: String boolean: Boolean number: Float }
input IndexerSettingValueInput { string: String boolean: Boolean number: Float }
type IndexerSettingOption { value: String! label: String! }
type IndexerSetting {
  name: String!
  type: String!
  label: String!
  secret: Boolean!
  configured: Boolean!
  value: IndexerSettingValue
  defaultValue: IndexerSettingValue
  options: [IndexerSettingOption!]!
}
input IndexerSettingChangeInput {
  name: String!
  value: IndexerSettingValueInput
  clear: Boolean = false
}
input BuiltinIndexerInput {
  definitionId: ID!
  name: String
  enabled: Boolean
  baseUrl: String
  trustedOrigins: [String!]
  settings: [IndexerSettingChangeInput!]
}
input BuiltinIndexerPatchInput {
  name: String
  enabled: Boolean
  baseUrl: String
  trustedOrigins: [String!]
  settings: [IndexerSettingChangeInput!]
}
input IndexerDefinitionFilterInput {
  query: String
  language: String
  privacy: String
  capability: String
  offset: Int = 0
  limit: Int = 50
}
type IndexerDefinition {
  "Whether the rule declares a login flow; independent of site privacy."
  loginSupported: Boolean!
  id: ID!
  name: String!
  description: String!
  language: String!
  privacy: String!
  digest: String!
  categories: [String!]!
  links: [String!]!
  modes: [String!]!
  warnings: [String!]!
  settings: [IndexerSetting!]!
}
type IndexerDefinitionPage {
  revision: String!
  totalCount: Int!
  offset: Int!
  limit: Int!
  items: [IndexerDefinition!]!
}
type IndexerInstance {
 recent: IndexerRecentExecutions!
 connectionRevision: String!
  "Whether the current built-in rule declares a login flow."
  loginSupported: Boolean!
  health: IndexerHealth!
  description: String!
  siteUrl: String!
  privacy: String!
  language: String!
  id: ID!
  kind: IndexerSourceKind!
  name: String!
  enabled: Boolean!
  definitionId: String!
  baseUrl: String!
  trustedOrigins: [String!]!
  ruleDigest: String!
  errorCode: String!
  modes: [String!]!
  settings: [IndexerSetting!]!
}
type IndexerInstances {
  jackettCatalogUpdatedAt: String
  jackettCatalogStale: Boolean!
  healthErrorCode: String!
  revision: String!
  ruleRevision: String!
  ruleErrorCode: String!
  catalogErrorCode: String!
  jackettEnabled: Boolean!
  order: [ID!]!
  items: [IndexerInstance!]!
}
type BuiltinIndexerResult { revision: String! instance: IndexerInstance! }

"Last observed outcome of each operation; absence means no matching observation."
type IndexerHealth {
  search: IndexerObservation
  fetch: IndexerObservation
}
type IndexerObservation {
  startedAt: String!
  finishedAt: String!
  errorCode: String!
  correlationId: String!
  retryAt: String
}

extend type Query {
  "Execution records, newest first. Retains 14 days plus each configured site's latest ten effective executions. before is an exclusive record ID."
  indexerDiagnostics(input: IndexerDiagnosticFilterInput!): IndexerDiagnosticPage!
}
type IndexerDiagnostic {
  executed: Boolean!
  elapsedKnown: Boolean!
  id: ID!
  instanceId: ID!
  name: String!
  operation: String!
  trigger: String!
  taskId: ID!
  code: String!
  searchId: ID!
  resourceId: ID!
  configRevision: String!
  bundleRevision: String!
  startedAt: String!
  finishedAt: String!
  mode: String!
  categories: [Int!]!
  limit: Int!
  offset: Int!
  errorCode: String!
  correlationId: String!
  retryAt: String
  results: Int!
  elapsedMs: Int!
  cacheHit: Boolean!
  partial: Boolean!
  truncated: Boolean!
  issueCount: Int!
  httpStatus: Int!
}

type IndexerRecentExecutions { count: Int! failures: Int! latestFailed: Boolean! }
input IndexerDiagnosticFilterInput {
 instanceId: ID
 query: String
 operation: String
 outcome: String
 since: String
 limit: Int! = 20
 before: ID
}
type IndexerDiagnosticPage { items: [IndexerDiagnostic!]! sites: [IndexerDiagnosticSite!]! total: Int! hasMore: Boolean! }
type IndexerDiagnosticSite { id: ID! name: String! }
