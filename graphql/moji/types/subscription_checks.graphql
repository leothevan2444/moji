enum SubscriptionCheckStatus {
  PENDING
  RUNNING
  SUCCEEDED
  SKIPPED
  PARTIAL
  FAILED
  INTERRUPTED
}

enum SubscriptionCheckTrigger {
  MANUAL
  SCHEDULED
}

enum SubscriptionCheckScope {
  ALL
  SINGLE
  SELECTED
}

type SubscriptionCheckItem {
	 details: SubscriptionCheckDetails
  performerId: ID!
  name: String!
  status: SubscriptionCheckStatus!
  error: String
  startedAt: String
  finishedAt: String
}

type SubscriptionCheckDetails {
 phase: String!
 catalogStatus: String!
 catalogErrorCode: String!
 catalogSource: String!
 catalogMode: String!
 catalogStopReason: String!
 catalogPages: Int!
 catalogPagesWithResults: Int!
 catalogScenes: Int!
 catalogReleases: Int!
 newCount: Int!
 knownCount: Int!
 upcomingCount: Int!
 inLibraryCount: Int!
 queuedCount: Int!
 reviewCount: Int!
 skippedCount: Int!
 creationFailedCount: Int!
 retryTotal: Int!
 retryAttempted: Int!
 retrySucceeded: Int!
 retryFailed: Int!
 retryDeferred: Int!
 omittedResults: Int!
 results: [SubscriptionCheckReleaseResult!]!
}

type SubscriptionCheckReleaseResult {
 key: ID!
 code: String!
 title: String!
 phase: String!
 outcome: String!
 reasonCode: String!
 errorCode: String!
 error: String!
 taskId: ID
 nextRetryAt: String
}

type SubscriptionCheckRun {
  id: ID!
  trigger: SubscriptionCheckTrigger!
  scope: SubscriptionCheckScope!
  status: SubscriptionCheckStatus!
  startedAt: String!
  finishedAt: String
  error: String
  totalCount: Int!
  completedCount: Int!
  succeededCount: Int!
  failedCount: Int!
  skippedCount: Int!
  items: [SubscriptionCheckItem!]!
}

extend type Query {
  subscriptionCheck(id: ID!): SubscriptionCheckRun
}

extend type Mutation {
  "Start a background check. Omit ids to check all subscriptions. Duplicate active checks return the existing run."
  startSubscriptionCheck(ids: [ID!]): SubscriptionCheckRun!
}

type SubscriptionCheckActivity {
  activeCount: Int!
  allRunId: ID
  performers: [PerformerCheckActivity!]!
}

type PerformerCheckActivity {
  performerId: ID!
  runId: ID!
  status: SubscriptionCheckStatus!
}

extend type Query {
  "Check reservations for at most 256 visible or selected actors; no history or upstream reads."
  subscriptionCheckActivity(ids: [ID!]!): SubscriptionCheckActivity!
}

"Confirmed activity observation; absent value/rank means evaluation is incomplete."
enum ActivityEvaluationStatus {
 READY
 NOT_CHECKED
 CHECK_FAILED
 INCOMPLETE_CATALOG
 INVALID_DATES
 INVALID_MEMBERSHIP
}
type PerformerActivity {
 evaluationStatus: ActivityEvaluationStatus!
 id: ID!
 value: Float
 rank: Int
 lowerBound: Boolean!
 observedAt: String
 lastSuccessAt: String
 nextCheckAt: String
}
extend type Query {
 performerActivity(id: ID!): PerformerActivity!
 "At most 100 retained runs; full actor results are loaded only on opening a run."
 subscriptionCheckHistory: [HomeSubscriptionCheckRun!]!
}
