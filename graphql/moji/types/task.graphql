extend type Query {
  "List torrents from qBittorrent"
  qbittorrentTorrents(limit: Int): [QBTorrent!]!

  "Get a Moji download task by id"
  task(id: ID!): Task

  "Read current Stash information for the scenes linked to a task."
  taskStashScenes(id: ID!): [TaskStashScene!]!

  "List Moji download tasks, newest first"
  tasks: [Task!]!
}

type Mutation {
  "Add a torrent to qBittorrent via magnet or http(s) URL"
  qbittorrentAdd(input: QBittorrentAddInput!): Boolean! @deprecated(reason: "Use addTorrent for persisted Moji task tracking.")

  "Add a torrent URL or magnet and create a persisted Moji task"
  addTorrent(input: QBittorrentAddInput!): Task!

  "Persist a download task immediately; search and submit torrent candidates in the background"
  downloadMedia(input: DownloadMediaInput!): Task!

  "Synchronize downloads and advance file preparation and Stash ingest, matching one background processing cycle"
  syncTaskProgress: [Task!]!

  "Trigger a Stash metadata scan for a single completed Moji task"
  triggerTaskStashScan(id: ID!): Task!

  "Trigger Stash metadata scans for completed Moji tasks"
  triggerStashScans: [Task!]!

  "Retry a blocked task or immediately check a task waiting for resources"
  retryTask(id: ID!): Task!

  "Delete downloaded and delivered files and linked Stash scenes, clear execution state, and return to manual torrent selection"
  restartTaskSourcing(id: ID!): Task!

  "Resolve a blocked sourcing task with a manually selected torrent"
  resolveBlockedSourcingTask(id: ID!, input: ResolveBlockedSourcingTaskInput!): Task!

  "Choose main video files in playback order for a blocked download"
  resolveTaskFiles(id: ID!, videoIndices: [Int!]!): Task!

  "Delete a persisted Moji task record"
  deleteTask(id: ID!): Task!

  "Retry blocked tasks or check waiting resources with per-task results"
  retryTasks(ids: [ID!]!): TaskBatchPayload!

  "Advance selected tasks through transfer and Stash ingest"
  processTaskIngest(ids: [ID!]!): TaskBatchPayload!

  "Delete selected tasks using the configured deletion policy"
  deleteTasks(ids: [ID!]!): TaskBatchPayload!
}

type QBTorrent {
  hash: String!
  name: String!
  progress: Float!
  state: String!
  dlspeed: Long!
  upspeed: Long!
  size: Long!
  eta: Long!
  category: String!
  tags: String!
  addedOn: Long!
}

input QBittorrentAddInput {
  url: String!
  savePath: String
  category: String
  tags: String
  paused: Boolean
}

input DownloadMediaInput {
  code: String!
  trackers: [String!]
  categories: [Int!]
  limit: Int
  savePath: String
  category: String
  tags: String
  paused: Boolean
}

input ResolveBlockedSourcingTaskInput {
  "Provide exactly one URL or uploaded torrent file."
  torrentUrl: String
  torrentFile: Upload
  title: String
  tracker: String
  infoHash: String
  size: Long
  seeders: Int
  peers: Int
  paused: Boolean
}

scalar Upload

enum TaskSource {
  MANUAL
  SEARCH
  SUBSCRIPTION
}

type Task {
  version: String!
  revision: Long!
  id: ID!
  files: [TaskFile!]!
  source: TaskSource!
  code: String!
  stage: TaskStage!
  stageStatus: TaskStageStatus!
  stageLabel: String!
  stageStatusLabel: String!
  stageErrorCode: String
  stageErrorMessage: String
  candidate: DownloadCandidate!
  torrentUrl: String!
  savePath: String
  category: String
  tags: String
  torrentHash: String
  torrentName: String
  progress: Float!
  qbittorrentState: String
  contentPath: String
  "Time when a selected torrent was successfully submitted to the downloader; null when not recorded."
  sourcingCompletedAt: String
  "Last automatic resource search; persists across restarts."
  sourcingLastCheckedAt: String
  "Next scheduled resource search; null when no search is scheduled."
  sourcingNextCheckAt: String
  downloadCompletedAt: String
  "Time when all ingest steps passed verification; null when not recorded."
  ingestCompletedAt: String

  mojiSourcePath: String
  transferAction: String
  mojiTransferPath: String
  transferError: String
  "Current Stash ingest step: SCAN, GENERATE, IDENTIFY, or VERIFY"
  stashIngestPhase: String
  stashGenerateJobId: ID
  stashIdentifyJobId: ID
  stashSceneIds: [ID!]!
  stashScanJobId: ID
  stashScanPath: String
  stashScanError: String
  stashScanHint: String
  stashScanStartedAt: String
  createdAt: String!
  updatedAt: String!
  "Last observed execution change, excluding unchanged polling; null for untracked history."
  lastProgressAt: String
}

enum TaskStage {
  SOURCING
  DOWNLOADING
  PENDING_INGEST
  TRANSFERRING
  SCANNING
  COMPLETED
}

enum TaskStageStatus {
  PENDING
  RUNNING
  BLOCKED
  DONE
}

type DownloadCandidate {
  title: String!
  tracker: String!
  infoHash: String!
  link: String!
  magnetUri: String!
  size: Long!
  seeders: Int!
  peers: Int!
}

enum TaskBatchStatus {
  SUCCEEDED
  SKIPPED
  FAILED
}

type TaskBatchResult {
  taskId: ID!
  status: TaskBatchStatus!
  reasonCode: String!
  task: Task
}

type TaskBatchSummary {
  requestedCount: Int!
  succeededCount: Int!
  skippedCount: Int!
  failedCount: Int!
}

type TaskBatchPayload {
  batchId: ID!
  summary: TaskBatchSummary!
  results: [TaskBatchResult!]!
}

"A classified qBittorrent file; order applies to selected main video parts"
type TaskFile {
  index: Int!
  path: String!
  size: Long!
  kind: String!
  part: Int!
  selected: Boolean!
  reason: String!
}

"A Stash scene linked to a task's ingest result."
type TaskStashScene {
  id: ID!
  title: String!
  code: String!
  date: String!
  studio: String!
  performers: [String!]!
  imageUrl: String
  url: String
}
