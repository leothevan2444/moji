fragment StashIdFragment on StashID {
  endpoint
  stash_id
  updated_at
}

fragment PerformerFragment on Performer {
  id
  name
  disambiguation
  gender
  birthdate
  ethnicity
  country
  eye_color
  height_cm
  urls
  alias_list
  favorite
  image_path
  scene_count
  stash_ids {
    ...StashIdFragment
  }
  rating100
  custom_fields
}

fragment StudioNameFragment on Studio {
  id
  name
}

fragment SceneFragment on Scene {
  id
  title
  code
  date
  urls
  studio {
    ...StudioNameFragment
  }
  paths {
    screenshot
  }
  stash_ids {
    ...StashIdFragment
  }
  performers {
    id
    name
  }
  tags {
    id
    name
  }
}

query PerformerSubscriptionFlags {
  allPerformers {
    id
    custom_fields
  }
}

query FindPerformerByID($id: ID!) {
  findPerformer(id: $id) {
    ...PerformerFragment
  }
}

query FindPerformers($performer_filter: PerformerFilterType, $filter: FindFilterType, $performer_ids: [Int!], $ids: [ID!]) {
  findPerformers(performer_filter: $performer_filter, filter: $filter, performer_ids: $performer_ids, ids: $ids) {
    count
    performers {
      ...PerformerFragment
    }
  }
}

query allPerformers {
  allPerformers {
    ...PerformerFragment
  }
}

query FindScenes($scene_filter: SceneFilterType, $filter: FindFilterType) {
  findScenes(scene_filter: $scene_filter, filter: $filter) {
    count
    scenes {
      ...SceneFragment
    }
  }
}

mutation UpdatePerformerCustomFields($input: PerformerUpdateInput!) {
  performerUpdate(input: $input) {
    ...PerformerFragment
  }
}

query GetVersion {
  version {
    hash
    build_time
    version
  }
}

mutation MetadataScan($input: ScanMetadataInput!) {
  metadataScan(input: $input)
}

query FindJob($input: FindJobInput!) {
  findJob(input: $input) {
    id
    status
    description
    progress
    startTime
    endTime
    addTime
    error
    subTasks
  }
}

fragment StashBoxFragment on StashBox {
  endpoint
  api_key
  name
  max_requests_per_minute
}

query Configuration {
  configuration {
    general {
      stashes {
        path
      }
      stashBoxes {
        ...StashBoxFragment
      }
    }
  }
}

query FindSceneCount {
  findScenes(filter: { per_page: 0 }) {
    count
  }
}

mutation MetadataGenerate($input: GenerateMetadataInput!) {
  metadataGenerate(input: $input)
}

mutation MetadataIdentify($input: IdentifyMetadataInput!) {
  metadataIdentify(input: $input)
}

fragment IdentifyOptionsFragment on IdentifyMetadataOptions {
  fieldOptions { field strategy createMissing }
  setCoverImage
  setOrganized
  includeMalePerformers
  skipMultipleMatches
  skipMultipleMatchTag
  skipSingleNamePerformers
  skipSingleNamePerformerTag
}

query IngestDefaults {
  configuration {
    defaults {
      identify {
        sources {
          source { stash_box_index stash_box_endpoint scraper_id }
          options { ...IdentifyOptionsFragment }
        }
        options { ...IdentifyOptionsFragment }
      }
    }
  }
}

query IngestScenes($scene_filter: SceneFilterType, $filter: FindFilterType, $ids: [ID!]) {
  findScenes(scene_filter: $scene_filter, filter: $filter, ids: $ids) {
    scenes {
      id
      title
      code
      date
      details
      director
      urls
      organized
      stash_ids { endpoint stash_id updated_at }
      tags { id }
      studio { id name }
      performers { id name }
      paths { screenshot }
      files { path }
    }
  }
}

mutation RemoveIngestScene($input: SceneDestroyInput!) {
  sceneDestroy(input: $input)
}

query IngestLogs {
  logs { time level message }
}

query ScrapeIngestScene($source: ScraperSourceInput!, $input: ScrapeSingleSceneInput!, $images: Boolean!) {
  scrapeSingleScene(source: $source, input: $input) {
    title code date details director urls remote_site_id
    image @include(if: $images)
    studio { ...IngestScrapedStudio }
    performers { ...IngestScrapedPerformer }
    tags { ...IngestScrapedTag }
  }
}
fragment IngestScrapedStudio on ScrapedStudio {
  stored_id name url urls image details aliases remote_site_id
  parent { stored_id name url urls image details aliases remote_site_id parent { stored_id name remote_site_id } }
}
fragment IngestScrapedPerformer on ScrapedPerformer {
  stored_id name disambiguation gender url urls twitter instagram birthdate ethnicity country
  eye_color height measurements fake_tits penis_length circumcised career_start career_end
  tattoos piercings aliases images details death_date hair_color weight remote_site_id
}
fragment IngestScrapedTag on ScrapedTag {
  stored_id name remote_site_id description alias_list parent { stored_id name remote_site_id }
}

query IngestIdentifyCapabilities {
  __type(name: "IdentifyMetadataOptions") { fields { name } }
}
query IngestDefaultsNative {
  configuration { defaults { identify {
    sources { source { stash_box_index stash_box_endpoint scraper_id } options { ...IdentifyOptionsFragment performerGenders } }
    options { ...IdentifyOptionsFragment performerGenders }
  } } }
}
query ScrapeIngestSceneLegacy($source: ScraperSourceInput!, $input: ScrapeSingleSceneInput!, $images: Boolean!) {
  scrapeSingleScene(source: $source, input: $input) {
    title code date details director urls remote_site_id image @include(if: $images)
    studio { ...IngestScrapedStudio }
    performers {
      stored_id name disambiguation gender url urls twitter instagram birthdate ethnicity country
      eye_color height measurements fake_tits penis_length circumcised career_length
      tattoos piercings aliases images details death_date hair_color weight remote_site_id
    }
    tags { stored_id name remote_site_id }
  }
}

query FindIngestStudios($criterion: StashIDCriterionInput!) {
  findStudios(studio_filter: { stash_id_endpoint: $criterion }, filter: { per_page: 2 }) { studios { id } }
}
query FindIngestPerformers($criterion: StashIDCriterionInput!) {
  findPerformers(performer_filter: { stash_id_endpoint: $criterion }, filter: { per_page: 2 }) { performers { id } }
}
query FindIngestTags($criterion: StashIDCriterionInput!) {
  findTags(tag_filter: { stash_id_endpoint: $criterion }, filter: { per_page: 2 }) { tags { id } }
}
query IngestStudio($id: ID!) { findStudio(id: $id) { id stash_ids { endpoint stash_id updated_at } } }
mutation CreateIngestStudio($input: StudioCreateInput!) { studioCreate(input: $input) { id } }
mutation UpdateIngestStudio($input: StudioUpdateInput!) { studioUpdate(input: $input) { id } }
mutation CreateIngestPerformer($input: PerformerCreateInput!) { performerCreate(input: $input) { id } }
mutation CreateIngestTag($input: TagCreateInput!) { tagCreate(input: $input) { id } }

mutation SaveIngestScene($input: SceneUpdateInput!) {
  sceneUpdate(input: $input) { id }
}
