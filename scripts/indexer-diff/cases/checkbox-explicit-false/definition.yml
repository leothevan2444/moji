id: replay-json
name: Replay JSON fixture
description: Synthetic comparison fixture; no real website
language: en-US
type: public
encoding: UTF-8
testlinktorrent: false
links: [https://fixture.invalid/]
caps:
  categories: {film: Movies/HD}
  modes: {search: [q]}
search:
  paths: [{path: /search, response: {type: json}}]
  inputs:
    q: '{{ .Keywords }}'
    category: '{{ join .Categories "," }}'
    enabled: '{{ .Config.enabled }}|{{ if eq .Config.enabled .True }}equal{{ else }}different{{ end }}|{{ if .Config.enabled }}yes{{ else }}no{{ end }}'
  rows: {selector: data}
  fields:
    title: {selector: name}
    category: {text: film}
    size: {text: 1GB}
    seeders: {text: 3}
    leechers: {text: 2}
    download: {selector: url}
settings:
  - {name: enabled, type: checkbox, default: true}
