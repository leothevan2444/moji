id: replay-json
name: Replay JSON fixture
description: Synthetic comparison fixture; no real website
language: en-US
type: public
encoding: UTF-8
testlinktorrent: false
links: [https://fixture.invalid/]
caps:
  categories: {film: Movies/HD}
  modes: {search: [q]}
search:
  paths: [{path: /search}]
  inputs:
    q: '{{ .Keywords }}'
    category: '{{ join .Categories "," }}'
  rows: {selector: article}
  fields:
    title: {selector: h2}
    category: {text: film}
    size: {text: 1GB}
    seeders: {text: 3}
    leechers: {text: 2}
    download: {selector: a, attribute: href}
    description: {selector: span, attribute: data-url, filters: [{name: querystring, args: "id"}]}
