id: replay-music-query
name: Replay music-query fixture
description: Synthetic comparison fixture; no real website
language: en-US
type: public
encoding: UTF-8
testlinktorrent: false
links: [https://fixture.invalid/]
caps:
  categories: {film: Movies/HD}
  modes: {search: [q], music-search: [q, artist, album]}
search:
  paths: [{path: /search, response: {type: json}}]
  inputs:
    q: '{{ .Keywords }}'
    artist: '{{ .Query.Artist }}'
    album: '{{ .Query.Album }}'
    category: '{{ join .Categories "," }}'
  rows: {selector: data}
  fields:
    title: {selector: name}
    category: {text: film}
    size: {text: 1GB}
    seeders: {text: 3}
    leechers: {text: 2}
    download: {selector: url}
