id: replay-json
name: Replay JSON fixture
description: Synthetic comparison fixture; no real website
language: en-US
type: public
encoding: UTF-8
testlinktorrent: false
links: [https://fixture.invalid/]
caps:
  categories: {film: Movies/HD}
  modes: {search: [q], movie-search: [q, imdbid, tmdbid, year], tv-search: [q, season, ep, imdbid, tvdbid], music-search: [q, artist], book-search: [q, title]}
search:
  paths: [{path: /search, response: {type: json}}]
  inputs:
    q: '{{ .Keywords }}'
    category: '{{ join .Categories "," }}'
    flags: 'IsBookSearch={{ .Query.IsBookSearch }}|IsDoubanQuery={{ .Query.IsDoubanQuery }}|IsGenreQuery={{ .Query.IsGenreQuery }}|IsIdSearch={{ .Query.IsIdSearch }}|IsImdbQuery={{ .Query.IsImdbQuery }}|IsMovieSearch={{ .Query.IsMovieSearch }}|IsMusicSearch={{ .Query.IsMusicSearch }}|IsRssSearch={{ .Query.IsRssSearch }}|IsSearch={{ .Query.IsSearch }}|IsTVRageQuery={{ .Query.IsTVRageQuery }}|IsTVSearch={{ .Query.IsTVSearch }}|IsTmdbQuery={{ .Query.IsTmdbQuery }}|IsTraktQuery={{ .Query.IsTraktQuery }}|IsTvdbQuery={{ .Query.IsTvdbQuery }}|IsTvmazeQuery={{ .Query.IsTvmazeQuery }}'
  rows: {selector: data}
  fields:
    title: {selector: name}
    category: {text: film}
    size: {text: 1GB}
    seeders: {text: 3}
    leechers: {text: 2}
    download: {selector: url}
