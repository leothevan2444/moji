id: replay-query-pagination-unset
name: Replay JSON fixture
description: Synthetic comparison fixture; no real website
language: en-US
type: public
encoding: UTF-8
testlinktorrent: false
links: [https://fixture.invalid/]
caps:
  categories: {film: Movies/HD}
  modes: {search: [q]}
search:
  paths: [{path: /search, response: {type: json}}]
  inputs:
    q: '{{ .Keywords }}'
    limit: '{{ .Query.Limit }}'
    offset: '{{ .Query.Offset }}'
    haslimit: '{{ if .Query.Limit }}present{{ else }}absent{{ end }}'
    hasoffset: '{{ if .Query.Offset }}present{{ else }}absent{{ end }}'
    category: '{{ join .Categories "," }}'
  rows: {selector: data}
  fields:
    title: {selector: name}
    category: {text: film}
    size: {text: 1GB}
    seeders: {text: 3}
    leechers: {text: 2}
    download: {selector: url}
