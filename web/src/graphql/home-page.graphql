query HomePageDocument {
  settings {
    system { taskDeletePolicy }
    automation { taskProcessingEnabled }
    stash {
      url
    }
    ingest {
      keepSubtitles

      downloads {
        qbRoot
        mojiRoot
      }
      library {
        mojiRoot
        stashRoot
      }
      transfer {
        action
      }
    }
    jackett {
      url
    }
    qbittorrent {
      url
      username
      defaultSavePath
    }
  }
  homeOverview {
    total attention active waiting completedLast24Hours
    attentionTasks { ...HomeTask }
    activeTasks { ...HomeTask }
    recentTasks { ...HomeTask }
  }
}

fragment HomeTask on Task {
    id
    source
    code
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    stageErrorCode
    stageErrorMessage
    files { index path size kind part selected reason }
    torrentUrl
    torrentName
    progress
    qbittorrentState
    contentPath
    torrentHash
    savePath
    category
    tags
    downloadCompletedAt
    sourcingCompletedAt ingestCompletedAt
    mojiSourcePath
    transferAction
    mojiTransferPath
    transferError
    stashIngestPhase
    stashGenerateJobId
    stashIdentifyJobId
    stashSceneIds
    stashScanJobId
    stashScanPath
    stashScanError
    stashScanHint
    stashScanStartedAt
    createdAt
    updatedAt lastProgressAt sourcingLastCheckedAt sourcingNextCheckAt
  }

query HomeSubscriptionSummary {
  homeSubscriptionSummary { total attention unchecked lastCheckedAt attentionPerformerIds }
}

query HomeSubscriptionChecks {
  homeSubscriptionChecks {
    enabled
    nextRunAt
    activeCount
    latestScheduled { ...HomeSubscriptionCheckRunFields }
    activeRuns { ...HomeSubscriptionCheckRunFields }
    recentRuns { ...HomeSubscriptionCheckRunFields }
  }
}

fragment HomeSubscriptionCheckRunFields on HomeSubscriptionCheckRun {
  id
  trigger
  scope
  status
  startedAt
  finishedAt
  totalCount
  completedCount
  succeededCount
  failedCount
  skippedCount
  currentPerformers { performerId name }
}
