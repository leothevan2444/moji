fragment IndexerNetworkSettingsFields on IndexerNetworkSettings {
 flareSolverrMaxTimeoutMs revision requestTimeoutSeconds siteTimeoutSeconds
 proxyEnabled proxyUrl proxyUsername proxyPasswordConfigured flareSolverrEnabled flareSolverrUrl
}
query IndexerNetworkSettings { indexerNetworkSettings { ...IndexerNetworkSettingsFields } }
mutation UpdateIndexerNetwork($expectedRevision:String!, $input:IndexerNetworkPatchInput!) { updateIndexerNetwork(expectedRevision:$expectedRevision,input:$input) { ...IndexerNetworkSettingsFields } }
