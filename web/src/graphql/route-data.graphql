query DiscoverConfigDocument {
  settings {
    automation {
      torrentSelection { version activeGroup rules { id name conditions { scope value minimum maximum } } groups { id name fallback require exclude tiers { id name rules } } }
    }
  }
}

query PerformersConfigDocument {
  settings {
    stash {
      url
    }
  }
}

query StatsPageDocument {
  dashboardStats {
    active
    completed
    pendingScans
    failed
  }
}
