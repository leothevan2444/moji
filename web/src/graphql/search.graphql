query DiscoverScenesDocument($input: DiscoverScenesInput!) {
  discoverScenes(input: $input) {
    items {
      key
      sceneId
      stashBoxEndpoint
      stashBoxName
      title
      durationSeconds
      code
      date
      studioName
      imageUrl
      url
      performerNames
      derivedQuery
    }
    usedStashBox {
      name
      endpoint
      performerId
      performerName
    }
    fallbackCount
    searchedQuery
  }
}

mutation QueueDiscoveredSceneDocument($input: QueueDiscoveredSceneInput!) {
  queueDiscoveredScene(input: $input) {
    id
    source
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    code
    torrentName
    progress

    createdAt
  }
}
