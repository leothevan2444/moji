query ServiceConnectionSettings {
  settings {
    stash { configured url apiKeyConfigured apiKey }
    jackett { configured url apiKeyConfigured apiKey passwordConfigured password }
    qbittorrent { configured url username usernameConfigured passwordConfigured password defaultSavePath category tags }
  }
}

query ServiceConnectionStatus {
  settingsStatus {
    stash { configured ready }
    jackett { configured ready }
    qbittorrent { configured ready }
    stashStats { lastError okAt }
    jackettStats { lastError okAt }
    qbittorrentStats { lastError okAt }
  }
}

query LibraryDeliverySettings {
  settings {
    delivery: ingest {
      keepSubtitles
      generateTranscodes

      downloads { qbRoot mojiRoot }
      library { mojiRoot stashRoot }
      transfer { action }
    }
    qbittorrent { defaultSavePath }
  }
  settingsStatus {
    stashLibraries { path }
    stashLibrariesLoadError
  }
}

query SettingsPolicySection {
  settings {
    policies: automation {
      taskProcessingEnabled
      taskProgressSyncIntervalSeconds
      subscriptionPollIntervalHours
      sourcingRetryIntervalHours
      stashBoxEndpoints
      subscriptionReleasePolicy { soloBehavior groupBehavior compilationBehavior vrBehavior maxGroupPerformerCount releaseDateRange }
      torrentSelection {
        enabled
        inspectionCandidateLimit
        fastRules {
          type enabled publishDate { direction } seeders { direction } size { direction }
          indexerPreference { trackerIds }
          titleMatch { clauses { pattern patternMode effect } }
          torrentFileNameMatch { clauses { pattern patternMode effect } }
        }
        torrentRules {
          type enabled publishDate { direction } seeders { direction } size { direction }
          indexerPreference { trackerIds }
          titleMatch { clauses { pattern patternMode effect } }
          torrentFileNameMatch { clauses { pattern patternMode effect } }
        }
      }
    }
  }
  settingsStatus {
    taskProcessing: automation { taskProgressSyncIntervalSeconds taskProgressSyncEnabled subscriptionPollIntervalHours subscriptionPollEnabled }
    metadataSources: stashBox { stashBoxes { name endpoint apiKeyConfigured } stashBoxesLoaded stashBoxesLoadError }
  }
}

query SystemSettingsTab {
  settings {
    system { language developerMode
      taskDeletePolicy imageCache { enabled maxSizeMb retentionDays } stashBoxDataCache { ttlHours } }
  }
  settingsStatus {
    imageCache { usedBytes entryCount cacheDirectory lastCleanupAt lastError }
    stashBoxDataCache { usedBytes sceneCount performerCount snapshotCount databasePath lastCleanupAt lastError }
  }
}

query AboutSettingsTab {
  version
}

query TaskDeletionSettings { settings { system { taskDeletePolicy } } }

mutation TestServiceConnection($input: TestServiceConnectionInput!) {
  testServiceConnection(input: $input) { code }
}
