mutation ClearImageCacheDocument {
  clearImageCache {
    usedBytes
    entryCount
    cacheDirectory
    lastCleanupAt
    lastError
  }
}

mutation ClearStashBoxDataCacheDocument {
  clearStashBoxDataCache {
    usedBytes
    sceneCount
    performerCount
    snapshotCount
    databasePath
    lastCleanupAt
    lastError
  }
}

mutation RefreshStashBoxes {
  refreshStashBoxes {
    automation {
      sourcingRetryIntervalHours
      stashBoxEndpoints
    }
  }
}

query LogsDocument($limit: Int, $minLevel: LogLevel) {
  logs(limit: $limit, minLevel: $minLevel) {
    sequence
    time
    level
    message
  }
}

mutation PatchSettings($input: SettingsPatchInput!) {
  patchSettings(input: $input) { system { language developerMode } }
}
