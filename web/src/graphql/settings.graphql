mutation UpdateStashSettingsDocument($input: UpdateStashSettingsInput!) {
  updateStashSettings(input: $input) {
    stash {
      configured
      url
      apiKeyConfigured
      apiKey
    }
  }
}

mutation UpdateLibraryDeliverySettings($input: UpdateIngestSettingsInput!) {
  updateLibraryDeliverySettings: updateIngestSettings(input: $input) {
    ingest {
      keepSubtitles
      generateTranscodes

      downloads {
        qbRoot
        mojiRoot
      }
      library {
        mojiRoot
        stashRoot
      }
      transfer {
        action
      }
    }
  }
}

mutation UpdateJackettSettingsDocument($input: UpdateJackettSettingsInput!) {
  updateJackettSettings(input: $input) {
    jackett {
      configured
      url
      apiKeyConfigured
      apiKey
      passwordConfigured
      password
    }
  }
}

mutation UpdateQBittorrentSettingsDocument($input: UpdateQBittorrentSettingsInput!) {
  updateQBittorrentSettings(input: $input) {
    qbittorrent {
      configured
      url
      username
      usernameConfigured
      passwordConfigured
      password
      defaultSavePath
      category
      tags
    }
  }
}

mutation UpdateSystemSettingsDocument($input: UpdateSystemSettingsInput!) {
  updateSystemSettings(input: $input) {
    system {
      language
      developerMode
      taskDeletePolicy
      imageCache {
        enabled
        maxSizeMb
        retentionDays
      }
      stashBoxDataCache { ttlHours }
    }
  }
}

mutation ClearImageCacheDocument {
  clearImageCache {
    usedBytes
    entryCount
    cacheDirectory
    lastCleanupAt
    lastError
  }
}

mutation ClearStashBoxDataCacheDocument {
  clearStashBoxDataCache {
    usedBytes
    sceneCount
    performerCount
    snapshotCount
    databasePath
    lastCleanupAt
    lastError
  }
}

mutation RefreshStashBoxes {
  refreshStashBoxes {
    automation {
      sourcingRetryIntervalHours
      stashBoxEndpoints
    }
  }
}

query LogsDocument($limit: Int, $minLevel: LogLevel) {
  logs(limit: $limit, minLevel: $minLevel) {
    sequence
    time
    level
    message
  }
}

mutation UpdateSettingsSection($input: UpdateSettingsSectionInput!) {
 updateSettingsSection(input: $input) { automation { taskProcessingEnabled } }
}

mutation UpdateStashBoxCacheSettings($ttlHours: Int!) {
 updateStashBoxCacheSettings(ttlHours: $ttlHours) { system { stashBoxDataCache { ttlHours } } }
}
