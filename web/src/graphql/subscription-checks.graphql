fragment SubscriptionCheckFields on SubscriptionCheckRun {
  id
  trigger
  scope
  status
  startedAt
  finishedAt
  error
  totalCount
  completedCount
  succeededCount
  failedCount
  skippedCount
  items {
    performerId
    name
    status
    error
    startedAt
    finishedAt
    details {
      phase catalogStatus catalogErrorCode catalogSource catalogMode catalogStopReason
      catalogPages catalogPagesWithResults catalogScenes catalogReleases
      newCount knownCount upcomingCount inLibraryCount queuedCount reviewCount skippedCount creationFailedCount
      retryTotal retryAttempted retrySucceeded retryFailed retryDeferred omittedResults
      results { key code title phase outcome reasonCode errorCode error taskId nextRetryAt }
    }
  }
}

query SubscriptionCheckActivity($ids: [ID!]!) {
  subscriptionCheckActivity(ids: $ids) {
    activeCount
    allRunId
    performers { performerId runId status }
  }
}

query SubscriptionCheckDetail($id: ID!) {
  subscriptionCheck(id: $id) { ...SubscriptionCheckFields }
}

mutation StartSubscriptionCheck($ids: [ID!]) {
  startSubscriptionCheck(ids: $ids) { id }
}

query PerformerActivity($id: ID!) {
 performerActivity(id:$id) { id evaluationStatus value rank lowerBound observedAt lastSuccessAt nextCheckAt }
}
query SubscriptionCheckHistory {
 subscriptionCheckHistory { ...HomeSubscriptionCheckRunFields }
}
