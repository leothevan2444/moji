query TasksOverviewDocument {
  dashboardStats {
    total
    active
    completed
    downloading
    pendingScans
    failed
  }
  tasks {
    id
    source
    code
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    stageErrorCode
    stageErrorMessage
    files { index path size kind part selected reason }
    torrentUrl
    torrentName
    progress
    qbittorrentState
    contentPath
    torrentHash
    savePath
    category
    tags
    downloadCompletedAt
    sourcingCompletedAt ingestCompletedAt
    mojiSourcePath
    transferAction
    mojiTransferPath
    transferError
    stashIngestPhase
    stashGenerateJobId
    stashIdentifyJobId
    stashSceneIds
    stashScanJobId
    stashScanPath
    stashScanError
    stashScanHint
    stashScanStartedAt
    createdAt
    updatedAt
  }
  settings { system { taskDeletePolicy } }
  settingsStatus {
    automation { taskProgressSyncIntervalSeconds taskProgressSyncEnabled }
  }
}
