mutation DeleteTaskDocument($id: ID!, $deleteStashScene: Boolean! = false) {
  deleteTask(id: $id, deleteStashScene: $deleteStashScene) {
    id
    source
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    code
    sourcingCompletedAt ingestCompletedAt
