query TaskDetailDocument($id: ID!) {
  task(id: $id) {
    id
    source
    code
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    stageErrorCode
    stageErrorMessage
    files { index path size kind part selected reason }
    candidate { title tracker infoHash link magnetUri size seeders peers }
    torrentUrl
    torrentName
    progress
    qbittorrentState
    contentPath
    torrentHash
    savePath
    category
    tags
    downloadCompletedAt
    mojiSourcePath
    transferAction
    mojiTransferPath
    transferError
    stashIngestPhase
    stashGenerateJobId
    stashIdentifyJobId
    stashSceneIds
    stashScanJobId
    stashScanPath
    stashScanError
    stashScanHint
    stashScanStartedAt
    createdAt
    updatedAt
  }
}

mutation AddTorrentDocument($input: QBittorrentAddInput!) {
  addTorrent(input: $input) {
    id
    source
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    stageErrorCode
    stageErrorMessage
    files { index path size kind part selected reason }
    code
    torrentName
    progress

    createdAt
  }
}

mutation SyncTaskProgressDocument {
  syncTaskProgress {
    id
    source
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    progress
    qbittorrentState
    updatedAt
  }
}

mutation TriggerStashScansDocument {
  triggerStashScans {
    id
    source

    transferError
    stashIngestPhase
    stashGenerateJobId
    stashIdentifyJobId
    stashSceneIds
    stashScanJobId
    stashScanPath
    stashScanError
    stashScanHint
    updatedAt
  }
}

mutation TriggerTaskStashScanDocument($id: ID!) {
  triggerTaskStashScan(id: $id) {
    id
    source

    transferError
    stashIngestPhase
    stashGenerateJobId
    stashIdentifyJobId
    stashSceneIds
    stashScanJobId
    stashScanPath
    stashScanError
    stashScanHint
    updatedAt
  }
}

mutation DeleteTaskDocument($id: ID!) {
  deleteTask(id: $id) {
    id
    source
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    code
    updatedAt
  }
}

mutation RetryTaskDocument($id: ID!) {
  retryTask(id: $id) {
    id
    source
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    stageErrorCode
    stageErrorMessage
    files { index path size kind part selected reason }
    code
    progress
    qbittorrentState
    updatedAt
  }
}

mutation RetryTasksDocument($ids: [ID!]!) {
  retryTasks(ids: $ids) {
    batchId
    summary { requestedCount succeededCount skippedCount failedCount }
    results {
      taskId status reasonCode
      task { id source code stage stageStatus stageLabel stageStatusLabel progress qbittorrentState updatedAt }
    }
  }
}

mutation ProcessTaskIngestDocument($ids: [ID!]!) {
  processTaskIngest(ids: $ids) {
    batchId
    summary { requestedCount succeededCount skippedCount failedCount }
    results {
      taskId status reasonCode
      task {
        id source code stage stageStatus stageLabel stageStatusLabel progress transferError
        stashIngestPhase stashGenerateJobId stashIdentifyJobId stashSceneIds
        stashScanJobId stashScanPath stashScanError stashScanHint updatedAt
      }
    }
  }
}

mutation DeleteTasksDocument($ids: [ID!]!) {
  deleteTasks(ids: $ids) {
    batchId
    summary { requestedCount succeededCount skippedCount failedCount }
    results { taskId status reasonCode task { id code stage stageStatus updatedAt } }
  }
}

mutation ResolveBlockedSourcingTaskDocument($id: ID!, $input: ResolveBlockedSourcingTaskInput!) {
  resolveBlockedSourcingTask(id: $id, input: $input) {
    id
    source
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    stageErrorCode
    stageErrorMessage
    files { index path size kind part selected reason }
    code
    candidate {
      title
      tracker
      infoHash
      size
      seeders
      peers
    }
    torrentUrl
    progress
    qbittorrentState
    updatedAt
  }
}

mutation ResolveTaskFilesDocument($id: ID!, $videoIndices: [Int!]!) {
  resolveTaskFiles(id: $id, videoIndices: $videoIndices) {
    id stage stageStatus stageErrorCode stageErrorMessage
    files { index path size kind part selected reason }
    updatedAt
  }
}
