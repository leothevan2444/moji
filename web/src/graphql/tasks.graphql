mutation RetryTasksDocument($ids: [ID!]!) {
  retryTasks(ids: $ids) {
    batchId
    summary { requestedCount succeededCount skippedCount failedCount }
    results {
      taskId status reasonCode
      task { id source code stage stageStatus stageLabel stageStatusLabel progress qbittorrentState sourcingCompletedAt ingestCompletedAt updatedAt lastProgressAt sourcingLastCheckedAt sourcingNextCheckAt }
    }
  }
}

mutation ProcessTaskIngestDocument($ids: [ID!]!) {
  processTaskIngest(ids: $ids) {
    batchId
    summary { requestedCount succeededCount skippedCount failedCount }
    results {
      taskId status reasonCode
      task {
        id source code stage stageStatus stageLabel stageStatusLabel progress transferError
        stashIngestPhase stashGenerateJobId stashIdentifyJobId stashSceneIds
        stashScanJobId stashScanPath stashScanError stashScanHint sourcingCompletedAt ingestCompletedAt updatedAt lastProgressAt sourcingLastCheckedAt sourcingNextCheckAt
      }
    }
  }
}

mutation DeleteTasksDocument($ids: [ID!]!, $deleteStashScene: Boolean! = false) {
  deleteTasks(ids: $ids, deleteStashScene: $deleteStashScene) {
    batchId
    summary { requestedCount succeededCount skippedCount failedCount }
    results { taskId status reasonCode task { id code stage stageStatus updatedAt lastProgressAt sourcingLastCheckedAt sourcingNextCheckAt } }
  }
}

