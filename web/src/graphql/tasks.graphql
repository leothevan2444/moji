query TaskDetailDocument($id: ID!) {
  taskDetailSnapshot(id: $id) {
   sequence streamId
   task {
    version revision
    sourcingMode
    film { endpoint sceneId code title date studio performers imageUrl url durationSeconds confirmationDigest }
    id
    source
    code
    stage
    stageStatus
    stageLabel
    stageStatusLabel
    stageErrorCode
    stageErrorMessage
    files { index path size kind part selected reason }
    candidate { title tracker infoHash link magnetUri size seeders peers }
    torrentUrl
    torrentName
    selectionReport { end partial selected evaluations { evidenceOmitted groupName tierName title status preferred reasons unknownRules evidence { attribute value source text } } }
    progress
    qbittorrentState
    contentPath
    torrentHash
    savePath
    category
    tags
    downloadCompletedAt
    sourcingCompletedAt ingestCompletedAt
    mojiSourcePath
    transferAction
    mojiTransferPath
    transferError
    stashIngestPhase
    stashGenerateJobId
    stashIdentifyJobId
    stashSceneIds
    stashScanJobId
    stashScanPath
    stashScanError
    stashScanHint
    stashScanStartedAt
    createdAt
    updatedAt lastProgressAt sourcingLastCheckedAt sourcingNextCheckAt
  }
}
}



